name: flake-update
on:
  schedule:
    # Daily nixpkgs bump lane. Renovate's nix manager cannot do this in
    # the stock renovate image: it shells out to `nix flake update`, and
    # the image has no nix binary (and its /nix/store is read-only).
  - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update flake.lock
        id: update
        run: |
          OLD=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          nix flake update
          NEW=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Open/update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: 'chore(deps): update flake.lock'
          title: 'chore(deps): update flake.lock'
          body: |
            Scheduled `nix flake update` (renovate's nix manager needs a
            nix binary, which the renovate image does not ship).

            Upstream dependency changes in this bump:

            https://github.com/NixOS/nixpkgs/compare/${{ steps.update.outputs.old }}...${{ steps.update.outputs.new }}

            (Only packages whose closure actually changed produce new image
            digests; unchanged apps rebuild byte-identical.)
          branch: chore/flake-lock
          delete-branch: true
