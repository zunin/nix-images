name: build-images

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to build"
        type: choice
        default: audiobookshelf
        options:
          - audiobookshelf
          - navidrome
          - kavita
          - jellyfin
          - hister
          - writefreely
          - freshrss
          - grocy
          - wallabag
  pull_request:
  push:
    branches: [main]

jobs:
  # Compute the app list, because a job-level `if` cannot reference `matrix`.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set.outputs.apps }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'apps=["${{ inputs.app }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'apps=["audiobookshelf","navidrome","kavita","jellyfin","hister","writefreely","freshrss","grocy","wallabag"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    permissions:
      contents: read
      packages: write
      actions: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Ensure flake.lock exists (first run)
        run: nix flake lock --accept-flake-config

      - name: Build image archive
        id: build
        env:
          APP: ${{ matrix.app }}
        run: |
          archive="$(nix build --no-link --print-out-paths .#packages.x86_64-linux.$APP-image)"
          version="$(nix eval --raw .#packages.x86_64-linux.$APP.version)"
          echo "archive=$archive" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_ENV"
          docker load < "$archive"

      - name: Push to GHCR (mutable + immutable tags)
        if: github.event_name == 'push'
        env:
          APP: ${{ matrix.app }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          LOCALTAG="ghcr.io/owner/$APP:$version"
          BASETAG="ghcr.io/${{ github.repository_owner }}/$APP"
          docker tag "$LOCALTAG" "$BASETAG:$version"
          docker tag "$LOCALTAG" "$BASETAG:$version-${{ github.run_number }}"
          docker push "$BASETAG:$version"
          docker push "$BASETAG:$version-${{ github.run_number }}"

      # nix SBOM (sbomnix flakeref -> CPEs) attached to GHCR so GitHub shows it
      # on the package page, and scanned with Grype (CPE/NVD, unlike Trivy which
      # can't map the pkg:nix ecosystem) into SARIF for the Security tab.
      - name: Generate + attach SBOM, Grype -> SARIF
        if: github.event_name == 'push'
        env:
          APP: ${{ matrix.app }}
          NIX_CONFIG: "experimental-features = nix-command flakes"
        run: |
          REV=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          NIXPKGS="github:NixOS/nixpkgs/$REV"

          # 1. SBOM with nixpkgs metadata (CPEs) — flakeref target, not a store path.
          nix run "$NIXPKGS#sbomnix" -- --cdx sbom.cdx.json "$NIXPKGS#$APP"

          # 2. Attach to GHCR as an OCI artifact named <digest>_cyclonedx.json
          #    (GitHub's convention for displaying SBOMs on the package page).
          BASETAG="ghcr.io/${{ github.repository_owner }}/$APP"
          DIGEST=$(docker manifest inspect -v "$BASETAG:$version-${{ github.run_number }}" \
            | jq -r 'if type=="array" then .[0] else . end | .Descriptor.digest | sub("sha256:"; "")')
          echo "${{ secrets.GITHUB_TOKEN }}" | nix run "$NIXPKGS#oras" -- login ghcr.io -u "${{ github.actor }}" --password-stdin
          # CycloneDX media type is what GitHub keys on to render the SBOM;
          # without it the artifact is a generic blob shown as a plain tag.
          nix run "$NIXPKGS#oras" -- push \
            --artifact-type application/vnd.cyclonedx+json \
            "$BASETAG:${DIGEST}_cyclonedx.json" \
            sbom.cdx.json:application/vnd.cyclonedx+json

          # 3. Scan the SBOM with Grype (CPE/NVD, unlike Trivy which can't map the
          #    pkg:nix ecosystem). Non-zero exit when vulns exist -> don't fail.
          nix run "$NIXPKGS#grype" -- -q -o sarif --file grype.sarif sbom:sbom.cdx.json || true
          # Enrich the SARIF so each alert is self-describing: Grype leaves the
          # artifactLocation.uri empty (rejected by code scanning) and the table
          # "Location" cell blank. Prefix app + fill in the image + location.
          jq --arg app "$APP" --arg image "$BASETAG:$version" '
            (.runs[0].tool.driver.rules // []) as $rules
            | .runs[0].tool.driver.rules = ($rules | map(
                .shortDescription.text = "[\($app)] " + .shortDescription.text
                | (if .help.markdown then
                     .help.markdown = (.help.markdown
                       | gsub("\\| nix +\\| +\\| nvd:cpe"; "| nix  | \($app)  | nvd:cpe")
                       | . + "\n**Image:** `\($image)`\n")
                   else . end)
              ))
            | .runs[0].results = ((.runs[0].results // []) | map(
                .message.text = "[\($app)] " + .message.text
                | .locations = [{ physicalLocation: { artifactLocation: { uri: "\($app)/sbom.cdx.json" }, region: { startLine: 1, startColumn: 1 } } }]
              ))
          ' grype.sarif > grype.fixed.sarif
          mv grype.fixed.sarif grype.sarif
          jq -r '"grype findings: \(.runs[0].results | length)"' grype.sarif 2>/dev/null || true

      - name: Upload Grype SARIF to Security tab
        if: github.event_name == 'push' && hashFiles('grype.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype.sarif
          category: grype-${{ matrix.app }}

      - name: Upload Grype SARIF artifact
        if: github.event_name == 'push' && hashFiles('grype.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: grype-${{ matrix.app }}-sarif
          path: grype.sarif
          if-no-files-found: ignore