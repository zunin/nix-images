name: build-images

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to build"
        type: choice
        default: audiobookshelf
        options:
          - audiobookshelf
          - navidrome
          - kavita
          - jellyfin
          - hister
          - writefreely
          - gatus
          - freshrss
          - grocy
          - wallabag
          - renovate
  pull_request:
  push:
    branches: [main]

jobs:
  # Compute the app list, because a job-level `if` cannot reference `matrix`.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'apps=["${{ inputs.app }}"]' >> "$GITHUB_OUTPUT"
          else
            # Derive the app list from the flake: every `packages.<system>.<app>-image`
            # output (strip the -image suffix). Adding apps/<name>.nix is enough.
            apps="$(nix eval --json '.#packages.x86_64-linux' --apply \
              'p: map (n: builtins.substring 0 (builtins.stringLength n - 6) n) (builtins.filter (n: builtins.match ".*-image" n != null) (builtins.attrNames p))')"
            echo "apps=$apps" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    permissions:
      contents: read
      packages: write
      actions: write
      security-events: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Ensure flake.lock exists (first run)
        run: nix flake lock --accept-flake-config

      - name: Resolve version and build fingerprint
        id: buildinfo
        env:
          APP: ${{ matrix.app }}
        run: |
          version="$(nix eval --raw .#packages.x86_64-linux.$APP.version)"
          fingerprint="$(nix eval --raw .#imageFingerprints.x86_64-linux.$APP)"
          echo "version=$version" >> "$GITHUB_ENV"
          echo "fingerprint=$fingerprint" >> "$GITHUB_ENV"
          echo "build fingerprint: $fingerprint"

      # Skip build and push when the published tag already carries the same
      # build fingerprint (app package + nixpkgs rev + image params + builder
      # version). The fingerprint is computed at eval time, so this also
      # avoids the expensive nondeterministic php/npm rebuilds when nothing
      # changed. PRs always build (validation); dispatch forces a rebuild.
      - name: Compare with published image
        id: gate
        if: github.event_name == 'push'
        env:
          APP: ${{ matrix.app }}
        run: |
          set -uo pipefail
          repo="${{ github.repository_owner }}/$APP"
          remote_fp=""
          token="$(curl -fsSL "https://ghcr.io/token?scope=repository:${repo}:pull" 2>/dev/null | jq -r '.token // empty' 2>/dev/null || true)"
          if [ -n "${token:-}" ]; then
            manifest="$(curl -fsSL \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${version}" 2>/dev/null || true)"
            config_digest="$(jq -r '.config.digest // empty' <<<"${manifest:-{\}}" 2>/dev/null || true)"
            if [ -n "${config_digest:-}" ]; then
              remote_fp="$(curl -fsSL -H "Authorization: Bearer $token" \
                "https://ghcr.io/v2/${repo}/blobs/${config_digest}" 2>/dev/null \
                | jq -r '.config.Labels["dev.zunin.build-fingerprint"] // empty' 2>/dev/null || true)"
            fi
          fi
          if [ -n "$remote_fp" ] && [ "$remote_fp" = "$fingerprint" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=$APP::unchanged ($fingerprint) — skipping build and push"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=$APP::building (local=$fingerprint remote=${remote_fp:-none})"
          fi

      - name: Build image archive
        id: build
        if: github.event_name != 'push' || steps.gate.outputs.build == 'true'
        env:
          APP: ${{ matrix.app }}
        run: |
          archive="$(nix build --no-link --print-out-paths .#packages.x86_64-linux.$APP-image)"
          echo "archive=$archive" >> "$GITHUB_ENV"
          docker load < "$archive"

      - name: Push to GHCR (mutable + immutable tags)
        if: github.event_name == 'push' && steps.gate.outputs.build == 'true'
        env:
          APP: ${{ matrix.app }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          LOCALTAG="ghcr.io/owner/$APP:$version"
          BASETAG="ghcr.io/${{ github.repository_owner }}/$APP"
          docker tag "$LOCALTAG" "$BASETAG:$version"
          docker tag "$LOCALTAG" "$BASETAG:$version-${{ github.run_number }}"
          docker push "$BASETAG:$version"
          docker push "$BASETAG:$version-${{ github.run_number }}"

      # nix SBOM (sbomnix flakeref -> CPEs) attested to the image via sigstore,
      # and scanned with Grype (CPE/NVD, unlike Trivy which can't map the pkg:nix
      # ecosystem) into SARIF for the Security tab.
      - name: Generate SBOM + Grype -> SARIF
        if: github.event_name == 'push' && steps.gate.outputs.build == 'true'
        env:
          APP: ${{ matrix.app }}
          NIX_CONFIG: "experimental-features = nix-command flakes"
        run: |
          REV=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          NIXPKGS="github:NixOS/nixpkgs/$REV"

          # SBOM/grype TOOLS pinned to the last-known-good nixpkgs rev: at
          # lock rev 3ec6363 (2026-10-25) sbomnix fails to build (its dep
          # python3.14-reuse-6.2.0 produces no 'man' output). The SBOM
          # TARGET below still evaluates $APP at the lock rev, so the SBOM
          # stays accurate. Drop this pin once a lock rev builds sbomnix
          # again.
          TOOLS_NIXPKGS="github:NixOS/nixpkgs/55bfb4d7437bd4e09ab7cba58a43bd68eb310044"

          # 1. SBOM with nixpkgs metadata (CPEs) — flakeref target, not a store path.
          nix run "$TOOLS_NIXPKGS#sbomnix" -- --cdx sbom.cdx.json "$NIXPKGS#$APP"

          # 2. The attestation steps below need the pushed image digest (the
          #    "sha256:..." form, as reported by the registry manifest).
          BASETAG="ghcr.io/${{ github.repository_owner }}/$APP"
          echo "digest=$(docker manifest inspect -v "$BASETAG:$version-${{ github.run_number }}" \
            | jq -r 'if type=="array" then .[0] else . end | .Descriptor.digest')" >> "$GITHUB_ENV"

          # 3. Scan the SBOM with Grype (CPE/NVD, unlike Trivy which can't map the
          #    pkg:nix ecosystem). Non-zero exit when vulns exist -> don't fail.
          nix run "$TOOLS_NIXPKGS#grype" -- \
            --vex openvex.json --sort-by risk -q \
            -o sarif=grype.sarif -o json=grype.json \
            "sbom:sbom.cdx.json" || true
          # Enrich the SARIF so each alert is self-describing: Grype leaves the
          # artifactLocation.uri empty (rejected by code scanning) and the table
          # "Location" cell blank. Prefix app + fill in the image + location.
          jq --arg app "$APP" --arg image "$BASETAG:$version" '
            (.runs[0].tool.driver.rules // []) as $rules
            | .runs[0].tool.driver.rules = ($rules | map(
                .shortDescription.text = "[\($app)] " + .shortDescription.text
                | (if .help.markdown then
                     .help.markdown = (.help.markdown
                       | gsub("\\| nix +\\| +\\| nvd:cpe"; "| nix  | \($app)  | nvd:cpe")
                       | . + "\n**Image:** `\($image)`\n")
                   else . end)
              ))
            | .runs[0].results = ((.runs[0].results // []) | map(
                .message.text = "[\($app)] " + .message.text
                | .locations = [{ physicalLocation: { artifactLocation: { uri: "\($app)/sbom.cdx.json" }, region: { startLine: 1, startColumn: 1 } } }]
              ))
          ' grype.sarif > grype.fixed.sarif
          mv grype.fixed.sarif grype.sarif
          jq -r '([.matches[]]|length) as $n | ([.matches[]|select(.vulnerability.knownExploited)]|length) as $k | ([.matches[]|select((.vulnerability.epss // [])|(map(.epss)|max // 0) >= 0.1)]|length) as $e | "grype: \($n) exposure findings (VEX applied) | KEV: \($k) | EPSS>=0.1: \($e)"' grype.json 2>/dev/null || true

      # GitHub-native attestations (sigstore-signed, OIDC): the SBOM and the
      # build provenance are bound to the image digest and pushed to GHCR, so
      # they show on the package page and verify with `gh attestation verify`.
      - name: Attest SBOM
        if: github.event_name == 'push' && steps.gate.outputs.build == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
          subject-digest: ${{ env.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Attest build provenance
        if: github.event_name == 'push' && steps.gate.outputs.build == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
          subject-digest: ${{ env.digest }}
          push-to-registry: true

      - name: Upload Grype SARIF to Security tab
        if: github.event_name == 'push' && steps.gate.outputs.build == 'true' && hashFiles('grype.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: grype.sarif
          category: grype-${{ matrix.app }}

      - name: Upload Grype SARIF artifact
        if: github.event_name == 'push' && steps.gate.outputs.build == 'true' && hashFiles('grype.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: grype-${{ matrix.app }}-sarif
          path: |
            grype.sarif
            grype.json
          if-no-files-found: ignore